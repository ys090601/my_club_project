<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소모임 - 관리자 전용</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1>관리자 페이지</h1>
      <a href="index.html" class="btn">메인으로</a>
    </div>

    <h2>신규 가입 신청 목록</h2>
    <table>
      <thead>
        <tr>
          <th>이름/연도/지역</th>
          <th>닉네임</th>
          <th>신청일</th>
          <th>처리</th>
        </tr>
      </thead>
      <tbody id="pendingUsersTable"></tbody>
    </table>

    <h2 style="margin-top:30px;">전체 회원 통계 및 관리</h2>
    <table>
      <thead>
        <tr>
          <th>회원 표시명</th>
          <th>참여 횟수</th>
          <th>취소 횟수</th>
          <th>상태</th>
          <th>관리자 메모</th>
          <th>조치</th>
        </tr>
      </thead>
      <tbody id="allUsersTable"></tbody>
    </table>
  </div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { checkAuth } from './js/auth.js';
    import { 
      collection, getDocs, doc, updateDoc, query, where, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkAuth(async (user) => {
      if (user.role !== 'admin') {
        alert("관리자 권한이 필요합니다.");
        window.location.href = "index.html";
        return;
      }
      loadAdminData();
    });

    async function loadAdminData() {
      // 승인 대기 목록
      const pendingSnap = await getDocs(query(collection(db, "users"), where("status", "==", "pending")));
      const pTable = document.getElementById('pendingUsersTable');
      pTable.innerHTML = '';
      
      pendingSnap.forEach(uSnap => {
        const u = uSnap.data();
        pTable.innerHTML += `
          <tr>
            <td>${u.displayName}</td>
            <td>${u.nickname}</td>
            <td>${u.email}</td>
            <td>
              <button class="btn btn-success" onclick="approveUser('${u.uid}')">승인</button>
            </td>
          </tr>
        `;
      });

      // 전체 회원 목록
      const allSnap = await getDocs(collection(db, "users"));
      const aTable = document.getElementById('allUsersTable');
      aTable.innerHTML = '';

      allSnap.forEach(uSnap => {
        const u = uSnap.data();
        aTable.innerHTML += `
          <tr>
            <td>${u.displayName}</td>
            <td>${u.joinCount || 0}회</td>
            <td>${u.cancelCount || 0}회</td>
            <td><span class="badge badge-${u.status}">${u.status}</span></td>
            <td><input type="text" value="${u.adminMemo || ''}" onchange="updateMemo('${u.uid}', this.value)"></td>
            <td>
              <button class="btn btn-danger" onclick="banUser('${u.uid}')">강퇴</button>
            </td>
          </tr>
        `;
      });
    }

    window.approveUser = async (uid) => {
      await updateDoc(doc(db, "users", uid), {
        status: "approved",
        approvedAt: serverTimestamp()
      });
      alert("승인 완료되었습니다.");
      loadAdminData();
    };

    window.updateMemo = async (uid, memo) => {
      await updateDoc(doc(db, "users", uid), { adminMemo: memo });
    };

    window.banUser = async (uid) => {
      if (confirm("정말 강퇴하시겠습니까?")) {
        await updateDoc(doc(db, "users", uid), { status: "banned" });
        loadAdminData();
      }
    };
  </script>
</body>
</html>
