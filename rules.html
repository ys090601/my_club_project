<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소모임 - 공지사항 및 이용 규칙</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1>소모임 이용 수칙 및 가이드</h1>
      <a href="index.html" class="btn">메인으로</a>
    </div>

    <div style="background:#f1f5f9; padding:20px; border-radius:8px; line-height:1.8;">
      <h3>📌 회원 준수 가이드</h3>
      <ol style="padding-left:20px; margin-top:10px;">
        <li><strong>표시명 규칙:</strong> 웹페이지 내 사용자는 <code>이름/출생연도/지역</code> (예: 홍길동/95/서울)으로 표기됩니다.</li>
        <li><strong>신규 회원 우대 혜택:</strong> 가입 후 1달 동안은 모임 정원이 차더라도 +2명까지 우선 참석 신청이 가능합니다.</li>
        <li><strong>1일 1일정 원칙:</strong> 동일한 날짜의 모임 추가 생성은 관리자 승인 후 개설됩니다.</li>
        <li><strong>참석 취소 매너:</strong> 모임 시작 24시간 전까지만 취소가 가능하며, 무단 불참 시 페널티가 부여될 수 있습니다.</li>
      </ol>
    </div>
  </div>
</body>
</html>
