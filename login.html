<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소모임 - 로그인</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 60px;">
    <h2>소모임 로그인</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>이메일 아이디</label>
        <input type="email" id="loginEmail" required placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" required placeholder="비밀번호 입력">
      </div>
      <button type="submit" class="btn" style="width:100%;">로그인</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
      아직 회원이 아니신가요? <a href="signup.html" style="color: #3498db; font-weight: bold; text-decoration: none;">회원가입 신청하기</a>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
