<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소모임 - 일정 및 참석 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- 상단 헤더 -->
    <div class="header-bar">
      <div>
        <h1 id="userWelcome" style="font-size:20px;">소모임 캘린더</h1>
        <p id="userInfo" style="font-size:12px; color:var(--subtext-color); font-weight: 500; margin-top: 4px;"></p>
      </div>
      <div class="btn-group">
        <select id="themeSelector" class="theme-select">
          <option value="system">⚙️ 시스템 설정</option>
          <option value="light">☀️ 밝은 모드</option>
          <option value="dark">🌙 어두운 모드</option>
        </select>
        <a href="rules.html" class="btn btn-warning">공지사항</a>
        <a href="admin.html" id="adminBtn" class="btn" style="display:none;">관리자</a>
        <button id="logoutBtn" class="btn btn-danger">로그아웃</button>
      </div>
    </div>

    <!-- 주요 고정 공지 배너 -->
    <div id="mainPinnedNotice" style="display:none; background:#fffbeb; border:1px solid #fef3c7; color:#b45309; padding:12px 15px; border-radius:8px; margin-bottom:15px; font-size:13px;">
      <strong id="pinnedNoticeTitle">📌 주요 공지사항</strong>
      <p id="pinnedNoticeContent" style="margin-top:4px; font-size:12px; color:#78350f; white-space:pre-wrap;"></p>
    </div>

    <!-- 기능 버튼 -->
    <div style="margin-bottom: 15px; display:flex; justify-content:space-between; gap:10px;">
      <button id="openCreateModalBtn" class="btn btn-success">+ 모임 일정 등록</button>
    </div>

    <!-- 월 선택 컨트롤러 -->
    <div class="calendar-controller">
      <button id="prevMonthBtn" class="btn btn-secondary">&lt; 이전달</button>
      <h2 id="currentYearMonth">2026년 10월</h2>
      <button id="nextMonthBtn" class="btn btn-secondary">다음달 &gt;</button>
    </div>

    <!-- 동적 캘린더 그리드 -->
    <div id="calendar" class="calendar-grid"></div>

    <!-- 📊 캘린더 아래 현황판 (10개 초과 시 표 2개로 자동 분할) -->
    <h3 style="margin-top:35px; margin-bottom:10px; font-size:16px;">📋 모임 일정 현황판</h3>
    <div class="dashboard-parallel-grid" id="statusDashboardGrid">
      <!-- 테이블 1 (기본 1~10번 모임) -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>모임일정명</th>
              <th>벙주</th>
              <th>인원현황(신입)</th>
              <th>인원 증설 횟수</th>
            </tr>
          </thead>
          <tbody id="statusTableBody1"></tbody>
        </table>
      </div>

      <!-- 테이블 2 (10개 초과 시에만 동적 노출) -->
      <div class="table-responsive" id="table2Wrapper" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>모임일정명</th>
              <th>벙주</th>
              <th>인원현황(신입)</th>
              <th>인원 증설 횟수</th>
            </tr>
          </thead>
          <tbody id="statusTableBody2"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 일정 등록 모달 -->
  <div id="createModal" class="modal-overlay">
    <div class="modal-content">
      <h2>신규 모임 등록</h2>
      <form id="createEventForm">
        <div class="form-group">
          <label>모임명</label>
          <input type="text" id="eventTitle" required placeholder="예: 10월 정기 정모">
        </div>
        <div class="form-group">
          <label>날짜 및 시간</label>
          <input type="datetime-local" id="eventDate" required onclick="this.showPicker()">
        </div>
        <div class="form-group">
          <label>집합장소</label>
          <input type="text" id="eventLocation" required placeholder="예: 강남역 2번 출구 맛집 앞">
        </div>
        <div class="form-group">
          <label>기본 정원 (명)</label>
          <input type="number" id="eventMax" required value="10" min="1">
        </div>
        <div class="form-group">
          <label>상세 일정</label>
          <textarea id="eventDesc" rows="5" required placeholder="[상세 일정 가이드]&#10;1차 : 강남 맛집 식사 (18:00)&#10;2차 : 볼링장 / 카페 이동 (20:00)&#10;회비 : 1/N (약 2~3만원)&#10;준비물 : 신분증, 매너"></textarea>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">등록하기</button>
        <button type="button" class="btn btn-secondary closeModal" style="width:100%; margin-top:6px;">취소</button>
      </form>
    </div>
  </div>

  <!-- 일정 수정 모달 -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <h2>모임 일정 수정</h2>
      <form id="editEventForm">
        <input type="hidden" id="editEventId">
        <div class="form-group">
          <label>모임명</label>
          <input type="text" id="editEventTitle" readonly style="opacity:0.7;">
        </div>
        <div class="form-group">
          <label>날짜 및 시간 (벙주/관리자 변경 가능)</label>
          <input type="datetime-local" id="editEventDate" required onclick="this.showPicker()">
        </div>
        <div class="form-group">
          <label>집합장소 (벙주/관리자 변경 가능)</label>
          <input type="text" id="editEventLocation" required>
        </div>
        <div class="form-group" id="editMaxGroup">
          <label>정원 (명)</label>
          <input type="number" id="editEventMax" min="1">
        </div>
        <div class="form-group">
          <label>상세 일정 (벙주/관리자 변경 가능)</label>
          <textarea id="editEventDesc" rows="5" required></textarea>
        </div>
        <div class="form-group" id="editOpenChatGroup" style="display:none;">
          <label>오픈채팅방 URL (수정 시 관리자 전용 입력)</label>
          <input type="url" id="editEventOpenChat" placeholder="https://open.kakao.com/o/...">
        </div>
        <button type="submit" class="btn btn-warning" style="width:100%;">수정 완료</button>
        <button type="button" class="btn btn-secondary closeModal" style="width:100%; margin-top:6px;">취소</button>
      </form>
    </div>
  </div>

  <!-- 일정 상세 및 RSVP 모달 -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 id="modalTitle" style="margin:0;">모임 상세</h2>
        <div id="ownerAdminControlBtns" style="display:none; gap:6px;">
          <button id="btnOpenEdit" class="btn btn-sm btn-warning">✏️ 수정</button>
          <button id="btnDeleteEvent" class="btn btn-sm btn-danger">🗑️ 삭제</button>
        </div>
      </div>
      
      <div style="font-size:13px; line-height:1.8; margin-bottom:15px; background:var(--table-header-bg); padding:12px; border-radius:6px;">
        <p><strong>벙주:</strong> <span id="modalHost"></span></p>
        <p><strong>일시:</strong> <span id="modalDate"></span></p>
        <p><strong>집합장소:</strong> <span id="modalLocation"></span></p>
        <p><strong>정원:</strong> <span id="modalCapacity"></span></p>
        <p><strong>내용:</strong> <span id="modalDesc" style="white-space:pre-wrap;"></span></p>
        <p id="modalOpenChatArea" style="display:none; margin-top:6px;">
          <strong>오픈채팅:</strong> <a id="modalOpenChatLink" href="#" target="_blank" class="btn btn-sm btn-warning">💬 오픈채팅방 참여하기</a>
        </p>
      </div>

      <h3 style="font-size:14px; color:var(--text-color);">참석자 명단</h3>
      <ul id="participantList" style="padding-left:20px; font-size:13px; margin-bottom:10px;"></ul>

      <h3 style="font-size:14px; color:var(--text-color);">대기자 명단</h3>
      <ul id="waitingList" style="padding-left:20px; font-size:13px; margin-bottom:15px;"></ul>

      <div id="rsvpButtons" style="display:flex; gap:8px;">
        <button id="btnAttend" class="btn btn-success" style="flex:1;">참석 신청</button>
        <button id="btnCancel" class="btn btn-danger" style="flex:1;">참석 취소</button>
      </div>
      <button class="btn btn-secondary closeModal" style="width:100%; margin-top:10px;">닫기</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
