<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소모임 - 회원가입 신청</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 40px;">
    <h2>신규 회원가입 신청</h2>
    <form id="signupForm">
      <div class="form-group">
        <label>이메일 아이디</label>
        <input type="email" id="signupEmail" required placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>비밀번호 (6자리 이상)</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="비밀번호 입력">
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="signupPasswordConfirm" required minlength="6" placeholder="비밀번호 재입력">
      </div>
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="signupName" required placeholder="홍길동">
      </div>
      <div class="form-group">
        <label>출생연도</label>
        <input type="number" id="signupBirthYear" required placeholder="1995" min="1950" max="2010">
      </div>
      <div class="form-group">
        <label>지역</label>
        <select id="signupRegion" required>
          <option value="">지역 선택</option>
          <option value="서울">서울</option>
          <option value="인천">인천</option>
          <option value="수원">경기 수원</option>
          <option value="성남">경기 성남</option>
          <option value="고양">경기 고양</option>
          <option value="용인">경기 용인</option>
          <option value="부천">경기 부천</option>
          <option value="안산">경기 안산</option>
          <option value="안양">경기 안양</option>
          <option value="남양주">경기 남양주</option>
          <option value="화성">경기 화성</option>
          <option value="평택">경기 평택</option>
          <option value="의정부">경기 의정부</option>
          <option value="파주">경기 파주</option>
          <option value="시흥">경기 시흥</option>
          <option value="김포">경기 김포</option>
          <option value="광명">경기 광명</option>
          <option value="기타">기타 수도권 외</option>
        </select>
      </div>
      <div class="form-group">
        <label>소모임 어플 닉네임</label>
        <input type="text" id="signupNickname" required placeholder="어플 닉네임 입력">
      </div>
      <div class="form-group">
        <label>인증키</label>
        <input type="password" id="signupAuthKey" required placeholder="소모임 지정 인증키 입력">
      </div>
      <button type="submit" class="btn btn-success" style="width:100%;">가입 신청하기</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
      이미 계정이 있으신가요? <a href="login.html" style="color: #3498db; font-weight: bold; text-decoration: none;">로그인 페이지로 돌아가기</a>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
